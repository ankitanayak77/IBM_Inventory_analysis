{% extends "base.html" %}

{% block title %}Sign In{% endblock %}
{% block breadcrumb %}
<span>Authentication</span>
<span>/</span>
<span class="breadcrumb-active">Sign In</span>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <!-- Auth Header -->
        <div class="auth-header">
            <div class="auth-brand-icon">📦</div>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your Smart Inventory & Analytics account</p>
        </div>



        <!-- Login Form -->
        <form method="POST" action="{{ url_for('login', next=request.args.get('next', '')) }}" id="loginForm" class="auth-form">
            <!-- CSRF Protection Token -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="email">
                    Work Email <span class="required">*</span>
                </label>
                <div class="input-with-icon">
                    <span class="input-icon">✉️</span>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="you@company.com" 
                        value="{{ email if email else '' }}"
                        autocomplete="email"
                        required
                        autofocus
                    >
                </div>
            </div>

            <div class="form-group">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <label class="form-label" for="password">
                        Password <span class="required">*</span>
                    </label>
                </div>
                <div class="input-with-icon">
                    <span class="input-icon">🔒</span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Enter your password" 
                        autocomplete="current-password"
                        required
                    >
                    <button type="button" class="password-toggle" onclick="togglePassword('password', this)" title="Show/Hide Password" aria-label="Toggle password visibility">
                        👁️
                    </button>
                </div>
            </div>

            <div class="form-row-auth">
                <label class="checkbox-label">
                    <input type="checkbox" name="remember" value="1" checked>
                    <span>Keep me signed in on this device</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">
                <span>Sign In to Dashboard &rarr;</span>
            </button>
        </form>

        <!-- Auth Footer Switch -->
        <div class="auth-footer">
            <span>New user?</span>
            <a href="{{ url_for('signup') }}" class="auth-link">Create an Account</a>
        </div>
    </div>
</div>

<style>
.auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 16px 60px 16px;
    min-height: calc(100vh - 180px);
}

.auth-card {
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: var(--radius-xl);
    padding: 36px 32px;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
}

.auth-header {
    text-align: center;
    margin-bottom: 22px;
}

.auth-brand-icon {
    font-size: 2.2rem;
    margin-bottom: 8px;
    display: inline-block;
}

.auth-title {
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--text-main);
    margin: 0 0 6px 0;
}

.auth-subtitle {
    font-size: 0.88rem;
    color: var(--text-muted);
    margin: 0;
}



.auth-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.input-with-icon {
    position: relative;
    display: flex;
    align-items: center;
}

.input-icon {
    position: absolute;
    left: 12px;
    font-size: 1rem;
    pointer-events: none;
    color: var(--text-light);
}

.input-with-icon .form-control {
    padding-left: 38px;
    padding-right: 40px;
}

.password-toggle {
    position: absolute;
    right: 10px;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.05rem;
    color: var(--text-muted);
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.7;
    transition: opacity 0.15s;
}

.password-toggle:hover {
    opacity: 1;
}

.form-row-auth {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 0.84rem;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    color: #334155;
    user-select: none;
}

.checkbox-label input[type="checkbox"] {
    accent-color: var(--brand-primary);
    width: 15px;
    height: 15px;
    cursor: pointer;
}

.btn-block {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.btn-lg {
    padding: 12px 18px;
    font-size: 0.95rem;
    font-weight: 600;
}

.auth-footer {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--border-subtle);
    text-align: center;
    font-size: 0.86rem;
    color: var(--text-muted);
}

.auth-link {
    color: var(--brand-primary);
    font-weight: 600;
    text-decoration: none;
    margin-left: 4px;
}

.auth-link:hover {
    text-decoration: underline;
    color: var(--brand-hover);
}
</style>

<script>


function togglePassword(inputId, btn) {
    const input = document.getElementById(inputId);
    if (!input) return;
    if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
    } else {
        input.type = 'password';
        btn.textContent = '👁️';
    }
}
</script>
{% endblock %}
